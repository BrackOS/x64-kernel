# GRUB menu for BrackOS. Used by `make iso` (copied to iso/boot/grub/grub.cfg).
set timeout=5
set default=0

menuentry "BrackOS v1.1.0 (x86-64 / 64-bit)" {
    multiboot2 /boot/kernel.bin
    boot
}

menuentry "BrackOS v1.1.0 (x86 / 32-bit, for CPUs without 64-bit support)" {
    multiboot2 /boot/kernel32.bin
    boot
}
