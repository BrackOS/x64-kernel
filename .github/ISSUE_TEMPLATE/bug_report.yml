name: Bug report
description: Report a bug or unexpected behavior
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the fields below as completely as possible.

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      description: Select the environment where the issue occurred.
      options:
        - QEMU
        - Real hardware
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: |
        Example: The kernel crashes during boot when ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: What did you expect to happen?
      description: Explain the intended behavior.
      placeholder: |
        Example: I expected the kernel to continue booting normally.
    validations:
      required: true

  - type: input
    id: software_version
    attributes:
      label: Software version
      description: Enter the build, tag, commit, or version you were using.
      placeholder: e.g. v0.4.1, commit abc1234, or custom build
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Include any relevant logs, commands, screenshots, or extra details.
      placeholder: |
        Example:
        - Boot command used
        - QEMU flags
        - Hardware model
        - Relevant output/log lines
